# Tunable thresholds and cadences for the AMS HIL tests.
# Adjust here so test code stays free of magic numbers.
#
# Aligned with `isc-fs/IFS08-CE-AMS#123` (v1.3.0-flatten bench session,
# chain-less rig, -DAMS_BMS_HIL_STUB=1 build). Mirrors constants in the
# firmware's `Core/Inc/app/ams_config.hpp`; if firmware moves, this file
# moves with it.

# -- Carrier slot -----------------------------------------------------
mlc_slot:                 2          # which carrier slot the AMS is in
mlc_boot_current_mA:      100        # min draw after K_n closes (bench: 118-128 mA)
mlc_boot_settle_s:        0.5        # delay after relay close before discover
                                     # short enough to catch BL before auto-jump

# -- CAN buses --------------------------------------------------------
bus_acu:                  can0       # FDCAN1 of the firmware (telemetry + ACU stim)
bus_bms_bl:               can2       # FDCAN2 (BL only; the app no longer listens here)

# -- Bootloader -------------------------------------------------------
bl_node_id:               0x01       # kAmsNodeId in ams_config.hpp (option-1 per isc-fs/IFS08-CE-AMS#123)
bl_discover_timeout_ms:   3000       # `--timeout-ms` on `can-flasher discover`
bl_per_frame_timeout_ms:  30000      # `--timeout` (per ISO-TP transaction)
bl_flash_timeout_s:       60         # overall subprocess timeout for `flash`
app_flash_address:        0x08020000 # AMS app image start (sector 1)
firmware_info_address:    0x08020400 # bl_fwinfo_t record (BL_APP_BASE + 0x400)

# -- Telemetry cadence (firmware: kTelemetryPeriodMs in MainTask) ----
tx_telemetry_period_ms:   500        # 0x4A0/4A1/4A2 cadence
tx_telemetry_jitter_ms:   20         # tolerance ± per A-008

# -- Stub-seeded BMS expectations (firmware: BmsService::seed_for_hil_stub)
stub_cell_mV:             3750       # all cells nominal mid-pack
stub_temp_C:              25         # all temps ambient
stub_module_count:        5          # kBmsModuleCount
stub_cells_per_module:    19         # kCellsPerModule
stub_module_online_mask:  0x1F       # kAllModulesMask (all 5 present)
stub_expected_pack_mV:    356250     # 5 * 19 * 3750 mV = pack_voltage_mV under stub

# -- FSM / predicate windows (firmware: ams_config.hpp) --------------
boot_grace_ms:            2000       # kSafetyBootGraceMs
state_transition_window_ms: 700       # observable window for FSM transitions.
                                     # The FSM itself transitions within ~3x
                                     # kSafetyPeriodMs (10 ms loop) of the
                                     # input change, but the 0x4A0 telemetry
                                     # is broadcast at tx_telemetry_period_ms
                                     # (500 ms), so the soonest WE can observe
                                     # the new state is up to a full
                                     # telemetry-cycle later. Window must
                                     # cover one cycle + slack.
precharge_max_ms:         1500       # kPrechargeMaxMs (timeout → Error)
transition_hold_ms:       100        # kTransitionHoldMs (DC bus held → Run)
vcu_stale_ms:             200        # kVcuStaleMs
i_stale_ms:               200        # kIStaleMs
i_max_mA:                 200000     # kImaxMa (200 A)

# -- ACU heartbeat (bench → AMS, simulates VCU 0x100) ----------------
acu_heartbeat_period_ms:  50         # 20 Hz, well under kVcuStaleMs = 200
acu_heartbeat_dc_bus_v:   0          # quiescent value (precharge tests override)

# -- Current-sensor heartbeat (bench DAC → AMS PF7 Hall input) -------
# Drives AMS PF7 via DAC4 ch0 so the firmware's current-stale predicate
# (kIStaleMs = 200) stays fresh and FSM is free to leave Start. Without
# this, FSM lands in Error within ~200 ms of boot grace and all
# Start->Precharge transitions are blocked (B-017 / C-021..C-026 fail
# loudly). DAC channel routing is bench-physical -- see CLAUDE.md
# DAC80504 wiring section. Voltage model in conftest::current_heartbeat
# uses 2.5 V at 0 A, 5.7 mV/A (matches ams_config.hpp Hall constants).
current_heartbeat_period_ms:   50    # 20 Hz, well under kIStaleMs = 200
current_heartbeat_dac_idx:     3     # broker idx 3 = DAC4 (U15)
current_heartbeat_dac_channel: 0     # ch0 -> AMS PF7
current_heartbeat_default_mA:  0     # quiescent 0 A (= 2.5 V on the DAC)

# -- ACU stim frame IDs (mirror firmware kAcuRx*) --------------------
acu_rx_dc_bus_id:         0x100      # extended, DLC 2, LE uint16 volts
# Retired in isc-fs/IFS08-CE-AMS#187: 0x600 start_button and 0x18FF50E7
# charger_detect are no longer FSM triggers. TSMS + DASH_CHG GPIO inputs
# replace them; see tsms_* / dash_chg_* keys below.

# -- TSMS routing (side-of-car external master switch) ----------------
# Drives AMS PF9. Active-high; both this AND dash_chg must be asserted
# to trigger Start -> Precharge. Bench jumper: IOEXP2_P10 -> SLOT1_AN0
# patch-header pin (MLC1 connector pin 14 -> AMS PF9).
tsms_tca_addr:            0x21       # IOEXP2 (U7 on backplane silk)
tsms_tca_port:            1          # port 1 (P10..P17)
tsms_tca_pin:             0          # P10 -> PF9

# -- DASH_CHG routing (cockpit dashboard / charger button) ------------
# Drives AMS PF10. Active-high. Bench jumper: IOEXP2_P11 -> SLOT1_AN1
# patch-header pin (MLC1 connector pin 15 -> AMS PF10). Sibling channel
# to TSMS so they share a TCA9555 port (conftest's _combined_output_mask
# helper handles the shared direction-register write idempotently).
dash_chg_tca_addr:        0x21
dash_chg_tca_port:        1
dash_chg_tca_pin:         1          # P11 -> PF10

# -- charger_0x101 (operator charge-request emitter, AMS #311 / #316) --
# A connected charger broadcasts 0x101 with magic 'CHRG' (0x43485247) at
# >= 2 Hz on the ACU bus (can0); the `charger_0x101` fixture emits it.
# Gates Charger-mode selection (VCU absent + 0x101 fresh) and the
# one-button Precharge->Transition proceed. pause() = charger disconnect.
charger_0x101_id:         0x101
charger_0x101_payload:    "4348524700000000"   # 'CHRG' + 4 zero bytes
charger_0x101_period_ms:  200                  # 5 Hz, well above the 2 Hz floor

# -- Relay-readback (AMS GPIO outputs sampled by bench ADC3 / MCP3208) -
# Per the bench wiring spec: SLOT2 connector taps PB4..PB7 to ADC3
# (silk: ADC3, broker idx 2) channels 0..3. The conftest fixture
# `relays_readback` exposes a read()/poll_for()/sample_for() helper
# that thresholds the analogue reading at the digital boundary.
ams_ok_adc_idx:           2          # ADC3 (= broker idx 2)
ams_ok_adc_channel:       0          # PB4
air_p_adc_idx:            2
air_p_adc_channel:        1          # PB5
air_n_adc_idx:            2
air_n_adc_channel:        2          # PB6
prech_adc_idx:            2
prech_adc_channel:        3          # PB7
relay_readback_digital_threshold_v: 1.65   # midpoint of 0-3.3 V CMOS

# -- Block E soak budgets --------------------------------------------
soak_idle_minutes:        30         # E-050 idle in Start
soak_run_minutes:         30         # E-051 in Run
power_cycle_count:        50         # E-052
power_cycle_on_s:         10
power_cycle_off_s:        5
