name: HIL Build Only

on:
  # Allow any repo to trigger this workflow
  workflow_call:
    inputs:
      firmware_repo:
        type: string
        required: true        # e.g. isc-fs/IFS08-CE
      firmware_ref:
        type: string
        required: true        # refs/heads/main | refs/tags/v1.2.3 | SHA
      firmware_subdir:
        type: string
        required: false
        default: ""           # subfolder inside the repo (e.g. IMU_TEST). Leave empty if firmware is at repo root.
      pr_repo:
        type: string
        required: false
        default: ""           # repo to post the result back to (e.g. isc-fs/IFS08-CE)
      pr_number:
        type: string
        required: false
        default: ""           # PR number to comment the result on
    secrets:
      TOKEN:
        required: false       # PAT for private repos; not needed for public repos

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: "org/repo of firmware (e.g. isc-fs/IFS08-CE)"
        required: true
        type: string
      firmware_ref:
        description: "branch, tag, or SHA to build"
        required: true
        type: string
      firmware_subdir:
        description: "subfolder inside the repo containing CMakeLists.txt (e.g. IMU_TEST). Leave empty if at repo root."
        required: false
        type: string
        default: ""
      pr_repo:
        description: "repo to post the result back to (e.g. isc-fs/IFS08-CE)"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number to comment the result on"
        required: false
        type: string
        default: ""

concurrency:
  group: build-only-${{ inputs.firmware_repo }}-${{ inputs.firmware_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout HIL repo
        uses: actions/checkout@v4

      - name: Checkout firmware repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.firmware_repo }}
          ref: ${{ inputs.firmware_ref }}
          path: firmware-src
          persist-credentials: false
          token: ${{ secrets.TOKEN || secrets.HIL_CROSS_REPO_PAT || github.token }}

      - name: Sync firmware into expected layout
        run: |
          SUBDIR="${{ inputs.firmware_subdir }}"
          SRC="firmware-src${SUBDIR:+/$SUBDIR}/"
          echo "Syncing from: $SRC"
          rm -rf firmware && mkdir -p firmware
          rsync -a --delete "$SRC" firmware/

      - name: Verify firmware layout
        run: |
          echo "firmware/ contents:"
          ls firmware
          test -f firmware/CMakeLists.txt && echo "CMakeLists.txt FOUND" || { echo "ERROR: CMakeLists.txt NOT FOUND"; exit 1; }

      - name: Build toolchain Docker image
        run: docker build -t ifs08hil -f docker/Dockerfile docker

      - name: Build firmware (FLASH)
        env:
          IMAGE: ifs08hil
          LD_VARIANT: FLASH
        run: bash scripts/build_stm32_binaries.sh

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          find build -maxdepth 1 \( -name "*.bin" -o -name "*.hex" \) -exec cp -v {} artifacts/ \;
          (cd artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Set artifact name
        run: |
          SAFE_NAME="firmware-$(echo '${{ inputs.firmware_repo }}-${{ inputs.firmware_ref }}' | tr '/' '-')"
          echo "ARTIFACT_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts
          retention-days: 14

      - name: Get artifact download URL
        if: always() && inputs.pr_number != ''
        id: artifact
        uses: actions/github-script@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          github-token: ${{ github.token }}
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifact = data.artifacts[0];
            if (artifact) {
              core.setOutput('url', `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`);
              core.setOutput('name', artifact.name);
            }

      - name: Post result back to PR
        if: always() && inputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          github-token: ${{ secrets.HIL_CROSS_REPO_PAT }}
          script: |
            const success = '${{ job.status }}' === 'success';
            const emoji   = success ? '✅' : '❌';
            const status  = success ? 'succeeded' : 'failed';
            const subdir  = '${{ inputs.firmware_subdir }}' || '(root)';
            const runUrl  = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const artifactUrl  = '${{ steps.artifact.outputs.url }}';
            const artifactName = '${{ steps.artifact.outputs.name }}';

            const lines = [
              `${emoji} HIL build **${status}** for \`${subdir}\` at \`${{ inputs.firmware_ref }}\``,
              ``,
              `[View run →](${runUrl})`,
            ];

            if (success && artifactUrl) {
              lines.push(``, `**Artifacts** (.hex + .bin + SHA256):`, `[⬇️ ${artifactName}](${artifactUrl})`);
            }

            const [owner, repo] = '${{ inputs.pr_repo }}'.split('/');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: parseInt('${{ inputs.pr_number }}'),
              body: lines.join('\n'),
            });
