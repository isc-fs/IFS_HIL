name: HIL Build Only

on:
  # Allow any repo to trigger this workflow
  workflow_call:
    inputs:
      firmware_repo:
        type: string
        required: true        # e.g. isc-fs/IFS08-DV
      firmware_ref:
        type: string
        required: true        # refs/heads/main | refs/tags/v1.2.3 | SHA
      firmware_subdir:
        type: string
        required: false
        default: ""           # subfolder inside the repo (e.g. IMU_TEST). Leave empty if firmware is at repo root.
    secrets:
      TOKEN:
        required: false       # PAT for private repos; not needed for public repos

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: "org/repo of firmware (e.g. isc-fs/IFS08-DV)"
        required: true
        type: string
      firmware_ref:
        description: "branch, tag, or SHA to build"
        required: true
        type: string
      firmware_subdir:
        description: "subfolder inside the repo containing CMakeLists.txt (e.g. IMU_TEST). Leave empty if at root."
        required: false
        type: string
        default: ""

concurrency:
  group: build-only-${{ inputs.firmware_repo }}-${{ inputs.firmware_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout HIL repo
        uses: actions/checkout@v4

      - name: Checkout firmware repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.firmware_repo }}
          ref: ${{ inputs.firmware_ref }}
          path: firmware-src
          persist-credentials: false
          token: ${{ secrets.TOKEN || secrets.HIL_CROSS_REPO_PAT || github.token }}

      - name: Sync firmware into expected layout
        run: |
          SUBDIR="${{ inputs.firmware_subdir }}"
          SRC="firmware-src${SUBDIR:+/$SUBDIR}/"
          echo "Syncing from: $SRC"
          rm -rf firmware && mkdir -p firmware
          rsync -a --delete "$SRC" firmware/

      - name: Verify firmware layout
        run: |
          echo "firmware/ contents:"
          ls firmware
          test -f firmware/CMakeLists.txt && echo "CMakeLists.txt FOUND" || { echo "ERROR: CMakeLists.txt NOT FOUND"; exit 1; }

      - name: Build toolchain Docker image
        run: docker build -t ifs08hil -f docker/Dockerfile docker

      - name: Build firmware (FLASH)
        env:
          IMAGE: ifs08hil
          LD_VARIANT: FLASH
        run: bash scripts/build_stm32_binaries.sh

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp -v build/firmware.bin artifacts/ || true
          cp -v build/firmware.hex artifacts/ || true
          (cd artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.firmware_repo != '' && inputs.firmware_repo || 'unknown' }}-${{ inputs.firmware_ref }}
          path: artifacts
          retention-days: 14
