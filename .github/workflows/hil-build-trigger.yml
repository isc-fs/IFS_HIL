name: HIL Build Trigger

# This workflow lives in IFS08-CE (or any firmware repo).
# A collaborator comments "/hil-build <subdir>" on a PR to kick off
# a build in IFS08_HIL and get the artifacts posted back here.

on:
  issue_comment:
    types: [created]

jobs:
  trigger:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # Only run on PR comments that start with /hil-build
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/hil-build')

    steps:
      - name: Check collaborator permission
        id: permission
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'maintain', 'write'].includes(data.permission);
            if (!allowed) {
              core.warning(`@${context.payload.comment.user.login} does not have permission to trigger HIL builds.`);
            }
            core.setOutput('allowed', allowed.toString());

      - name: React with eyes 👀
        if: steps.permission.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Parse subdir from comment
        if: steps.permission.outputs.allowed == 'true'
        id: parse
        run: |
          COMMENT="${{ github.event.comment.body }}"
          SUBDIR=$(echo "$COMMENT" | awk '{print $2}')
          if [ -z "$SUBDIR" ]; then
            echo "Usage: /hil-build <subfolder>"
            exit 1
          fi
          echo "subdir=$SUBDIR" >> $GITHUB_OUTPUT

      - name: Get PR head SHA
        if: steps.permission.outputs.allowed == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', data.head.sha);

      - name: Trigger HIL build in IFS08_HIL
        if: steps.permission.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HIL_CROSS_REPO_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'isc-fs',
              repo: 'IFS08_HIL',
              workflow_id: 'hil-build-only.yml',
              ref: 'main',
              inputs: {
                firmware_repo:   context.repo.owner + '/' + context.repo.repo,
                firmware_ref:    '${{ steps.pr.outputs.sha }}',
                firmware_subdir: '${{ steps.parse.outputs.subdir }}',
                pr_repo:         context.repo.owner + '/' + context.repo.repo,
                pr_number:       context.issue.number.toString(),
              },
            });

      - name: Post triggered comment
        if: steps.permission.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `🔨 HIL build triggered for \`${{ steps.parse.outputs.subdir }}\` at \`${{ steps.pr.outputs.sha }}\``,
                ``,
                `[View build →](https://github.com/isc-fs/IFS08_HIL/actions/workflows/hil-build-only.yml)`,
              ].join('\n'),
            });
