[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hil-bench"
version = "0.1.0"
description = "CLI utilities and automation helpers for the Raspberry Pi HIL bench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "pytest>=7.4",
    "pytest-html>=4.0",
    "spidev>=3.5",
    "smbus2>=0.4",
    "RPi.GPIO>=0.7",
    "python-can>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
hil = "tools.flash:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.pytest.ini_options]
markers = [
    "soak: long-running bench-endurance test; opt-in via `pytest -m soak`.",
]
