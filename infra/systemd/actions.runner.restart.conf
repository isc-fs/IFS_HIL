# Drop-in for the GitHub Actions self-hosted runner unit.
#
# Installed by scripts/bench_setup.sh as
#   /etc/systemd/system/actions.runner.<org>-<repo>.<bench>.service.d/restart.conf
# The unit itself is generated by the runner's own `svc.sh install`, so it is
# not in this directory; its name carries the org, repo and runner name.
#
# Why: the stock unit has no Restart= policy, so a runner that EXITS is never
# brought back. On 2026-09-18 bench-01's runner got a transient
#   "Failed to create a session. The runner registration has been deleted
#    from the server"
# from GitHub, logged "no retry needed", and exited cleanly. Nothing restarted
# it. The registration was in fact intact (agentId 21 matched GitHub's runner
# id 21) and a plain restart a week later brought it straight back -- but for
# that week every dispatched run queued against an offline runner and timed
# out, while the bench hardware stayed healthy (IFS_HIL#140).

[Unit]
# Never give up. systemd's default start limit stops restarting a unit that
# fails repeatedly; a runner that cannot reach GitHub during a network outage
# would then stay down after the network returns.
StartLimitIntervalSec=0

[Service]
Restart=always
# Slow enough not to hammer GitHub if the registration really HAS been deleted
# -- in which case this loops harmlessly and `bench watchdog` reports the
# runner as down every five minutes until someone re-registers it.
RestartSec=60
