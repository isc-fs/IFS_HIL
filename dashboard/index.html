<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BACKPLANE_HIL — Dashboard</title>
<style>
  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --border:  #2a2d3a;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #eab308;
    --blue:    #3b82f6;
    --font:    'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 15px; letter-spacing: 0.05em; color: var(--blue); }
  #meta { color: var(--muted); font-size: 11px; text-align: right; line-height: 1.6; }
  #conn-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--muted); margin-right: 5px;
    vertical-align: middle;
  }
  #conn-dot.ok  { background: var(--green); }
  #conn-dot.err { background: var(--red); }

  /* ---- Main layout ---- */
  main { padding: 20px 24px; }

  /* The original card grid only applies inside the Bench tab so it
     doesn't clamp other tabs (e.g. CAN trace) to a 320 px column. */
  #main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* ---- Card ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card-header .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted);
  }
  .card-header .dot.ok     { background: var(--green); }
  .card-header .dot.err    { background: var(--red); }
  .card-header .dot.warn   { background: var(--yellow); }
  .card-body { padding: 12px 14px; }

  /* ---- PSU card ---- */
  .psu-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #psu-status { font-size: 22px; font-weight: bold; }
  #psu-status.ok  { color: var(--green); }
  #psu-status.err { color: var(--red); }

  /* ---- Tabs ---- */
  #tabs { display: flex; gap: 6px; margin: 0 18px; }
  .tab {
    background: transparent; border: none; color: var(--muted);
    font: inherit; padding: 8px 14px; cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--fg); border-bottom-color: var(--green); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ---- CAN trace tab ---- */
  #can-controls { display: flex; flex-wrap: wrap; gap: 12px;
                  align-items: center; margin-bottom: 10px; }
  #can-controls button { padding: 4px 10px; cursor: pointer; }
  .muted { color: var(--muted); font-size: 11px; }
  #can-list {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.4;
    background: #0f0f10; border: 1px solid #2a2a2c;
    padding: 6px 8px; height: 65vh; overflow-y: auto;
  }
  .frame-row { display: grid;
               grid-template-columns: 110px 50px 90px 26px 1fr 1fr;
               gap: 8px; padding: 2px 0; }
  .frame-row:hover { background: #1c1c1e; }
  .f-ts { color: var(--muted); }
  .f-bus { color: #6ab0f5; }
  .f-id { color: #f0a868; font-weight: 600; }
  .f-dlc { color: var(--muted); }
  .f-data { color: var(--fg); }
  .f-dec { color: var(--green); white-space: nowrap; overflow: hidden;
           text-overflow: ellipsis; }
  /* Highlights for known IDs */
  .frame-row.kind-ams_telem_status  .f-id { color: #ffd166; }
  .frame-row.kind-ams_telem_pack    .f-id { color: #ef476f; }
  .frame-row.kind-ams_telem_temps   .f-id { color: #06d6a0; }
  .frame-row.kind-vcu_dc_bus        .f-id { color: #c77dff; }

  /* ---- Table inside cards ---- */
  table { width: 100%; border-collapse: collapse; }
  td, th {
    padding: 4px 6px;
    text-align: left;
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: normal; font-size: 11px; }
  tr + tr td { border-top: 1px solid var(--border); }
  .val { color: var(--text); }
  .err-val { color: var(--red); }
  .ok-val  { color: var(--green); }
  .muted   { color: var(--muted); }

  /* ---- Overcurrent row highlight ---- */
  tr.overcurrent td { background: rgba(239,68,68,0.12); color: var(--red); }
  tr.overcurrent .toggle-label { color: var(--red); }

  /* ---- Channel grid (ADC/DAC) ---- */
  .ch-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .ch-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 6px;
  }
  .ch-label { color: var(--muted); font-size: 10px; }
  .ch-val   { font-size: 13px; }

  /* ---- DAC setpoint input ---- */
  .dac-input-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }
  .dac-input-row input[type=number] {
    width: 68px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    padding: 2px 4px;
    outline: none;
  }
  .dac-input-row input[type=number]:focus { border-color: var(--blue); }
  .btn-set {
    background: #1e3a5f;
    border: 1px solid var(--blue);
    border-radius: 3px;
    color: var(--blue);
    font-family: var(--font);
    font-size: 10px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .btn-set:hover { background: #2a4f80; }
  .btn-set:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- CAN mode selector ---- */
  .can-select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    padding: 2px 4px;
    outline: none;
    cursor: pointer;
  }
  .can-select:focus { border-color: var(--blue); }
  .can-select:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- Port bits (TCA9555) ---- */
  .bits {
    display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px;
  }
  .bit {
    width: 16px; height: 16px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; border: 1px solid var(--border);
  }
  .bit.hi { background: var(--green); color: #000; }
  .bit.lo { background: var(--bg);    color: var(--muted); }
  .port-label { color: var(--muted); font-size: 10px; margin-top: 8px; margin-bottom: 2px; }

  /* ---- Carrier power toggle ---- */
  .toggle-wrap { display: flex; align-items: center; gap: 8px; }
  .toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: var(--border); border-radius: 20px;
    transition: background 0.2s;
  }
  .slider::before {
    content: ''; position: absolute;
    width: 14px; height: 14px; left: 3px; top: 3px;
    background: var(--muted); border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider { background: #16532d; }
  .toggle input:checked + .slider::before { transform: translateX(16px); background: var(--green); }
  .toggle input:disabled + .slider { opacity: 0.4; cursor: not-allowed; }
  .toggle-label { font-size: 11px; color: var(--muted); min-width: 22px; }

  /* ---- Placeholder ---- */
  .placeholder { color: var(--muted); font-style: italic; padding: 8px 0; }
</style>
</head>
<body>

<header>
  <h1>&#9632; BACKPLANE_HIL</h1>
  <nav id="tabs">
    <button class="tab active" data-tab="bench" onclick="switchTab('bench')">Bench</button>
    <button class="tab"        data-tab="can"   onclick="switchTab('can')">CAN trace</button>
  </nav>
  <div id="meta">
    <span id="conn-dot"></span><span id="conn-label">connecting…</span><br>
    <span id="ts">—</span>
  </div>
</header>

<main>
  <div id="tab-bench" class="tab-pane active">
    <div id="main">
      <div class="card"><div class="card-body placeholder">Loading…</div></div>
    </div>
  </div>

  <div id="tab-can" class="tab-pane">
    <div class="card">
      <div class="card-header">CAN trace
        <span id="can-status" class="muted" style="margin-left:14px;">disconnected</span>
      </div>
      <div class="card-body">
        <div id="can-controls">
          <label>Bus:</label>
          <label><input type="checkbox" class="can-bus" value="can0" checked> can0</label>
          <label><input type="checkbox" class="can-bus" value="can1" checked> can1</label>
          <label><input type="checkbox" class="can-bus" value="can2" checked> can2</label>
          <label style="margin-left:18px;">ID filter:
            <input type="text" id="can-idfilter" placeholder="e.g. 4A* or 100"
                   style="width:90px;padding:2px 6px;">
          </label>
          <button id="can-pause" onclick="canTogglePause()">Pause</button>
          <button onclick="canClear()">Clear</button>
          <label style="margin-left:14px;">
            <input type="checkbox" id="can-autoscroll" checked> auto-scroll
          </label>
          <span id="can-count" class="muted" style="margin-left:14px;">0 frames</span>
        </div>
        <div id="can-list"></div>
      </div>
    </div>
  </div>
</main>

<script>
const POLL_MS = 2000;
const CAN_MODES = ['normal','sleep','loopback','listenonly','config'];

function dot(ok, warn) {
  const cls = warn ? 'warn' : (ok ? 'ok' : 'err');
  return `<span class="dot ${cls}"></span>`;
}

function fmtErr(name) {
  return `<tr><td colspan="6" class="err-val">&#9888; ${name}: not responding</td></tr>`;
}

// ---- Renderers ----

function renderPSU(psu) {
  const ok = psu && psu.ok;
  const on = psu && psu.on;
  return `
    <div class="card">
      <div class="card-header">${dot(ok)} ATX PSU</div>
      <div class="card-body">
        <div class="psu-row">
          <div id="psu-status" class="${ok ? 'ok' : 'err'}">${ok ? 'PWR_OK' : 'NO POWER'}</div>
          <label class="toggle" title="PSU power">
            <input type="checkbox" id="psu-toggle" ${on ? 'checked' : ''} onchange="togglePSU(this)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>`;
}

function renderCAN(cans, psuOn) {
  const rows = cans.map((c, i) => {
    if (!c.ok) return fmtErr(c.name);
    const tecClass = c.tec > 0 ? 'err-val' : 'ok-val';
    const recClass = c.rec > 0 ? 'err-val' : 'ok-val';
    const options = CAN_MODES.map(m =>
      `<option value="${m}" ${m === c.mode ? 'selected' : ''}>${m}</option>`
    ).join('');
    return `<tr>
      <td class="val">${c.name}</td>
      <td class="${tecClass}">TEC&nbsp;${c.tec}</td>
      <td class="${recClass}">REC&nbsp;${c.rec}</td>
      <td><select class="can-select" ${psuOn ? '' : 'disabled'}
            onchange="setCANMode(${i}, this)">${options}</select></td>
    </tr>`;
  }).join('');
  const allOk = cans.every(c => c.ok);
  return `
    <div class="card">
      <div class="card-header">${dot(allOk)} CAN Controllers</div>
      <div class="card-body">
        <table>
          <thead><tr><th>Controller</th><th>TEC</th><th>REC</th><th>Mode</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderADC(adcs) {
  const sections = adcs.map(a => {
    const header = `<div class="card-header" style="border-top:1px solid var(--border)">${dot(a.ok)} ${a.name}</div>`;
    if (!a.ok) return header + `<div class="card-body"><span class="err-val">&#9888; not responding</span></div>`;
    const cells = a.channels.map((v, i) =>
      `<div class="ch-cell"><div class="ch-label">ch${i}</div><div class="ch-val">${v.toFixed(3)}&nbsp;V</div></div>`
    ).join('');
    return header + `<div class="card-body"><div class="ch-grid">${cells}</div></div>`;
  }).join('');
  const allOk = adcs.every(a => a.ok);
  return `
    <div class="card" style="grid-column: span 2">
      <div class="card-header">${dot(allOk)} ADC Inputs &mdash; 3&times; MCP3208</div>
      ${sections}
    </div>`;
}

function renderDAC(dacs, psuOn) {
  const sections = dacs.map((d, di) => {
    const header = `<div class="card-header" style="border-top:1px solid var(--border)">${dot(d.ok)} ${d.name}</div>`;
    if (!d.ok) return header + `<div class="card-body"><span class="err-val">&#9888; not responding</span></div>`;
    const cells = d.channels.map((v, ch) =>
      `<div class="ch-cell">
        <div class="ch-label">ch${ch}</div>
        <div class="ch-val">${v.toFixed(3)}&nbsp;V</div>
        <div class="dac-input-row">
          <input type="number" min="0" max="3.3" step="0.001" value="${v.toFixed(3)}"
                 id="dac-${di}-${ch}" ${psuOn ? '' : 'disabled'}>
          <button class="btn-set" onclick="setDAC(${di},${ch},this)" ${psuOn ? '' : 'disabled'}>Set</button>
        </div>
      </div>`
    ).join('');
    return header + `<div class="card-body"><div class="ch-grid">${cells}</div></div>`;
  }).join('');
  const allOk = dacs.every(d => d.ok);
  return `
    <div class="card" style="grid-column: span 2">
      <div class="card-header">${dot(allOk)} DAC Outputs &mdash; 4&times; DAC80504</div>
      ${sections}
    </div>`;
}

function renderPower(power, psuOn) {
  const hasOC = power.some(p => p.overcurrent);
  const rows = power.map((p, i) => {
    const slot = i + 1;
    const checked = p.relay_on ? 'checked' : '';
    const disabled = psuOn ? '' : 'disabled';
    const toggle = `
      <label class="toggle">
        <input type="checkbox" ${checked} ${disabled} onchange="toggleCarrier(${slot}, this)">
        <span class="slider"></span>
      </label>
      <span class="toggle-label">${p.relay_on ? 'ON' : 'OFF'}</span>`;
    const ocClass = p.overcurrent ? ' class="overcurrent"' : '';
    if (!p.present)
      return `<tr${ocClass}>
        <td class="val">${p.name}</td>
        <td colspan="3" class="muted">not present</td>
        <td><div class="toggle-wrap">${toggle}</div></td>
      </tr>`;
    const iClass = p.overcurrent ? 'err-val' : (Math.abs(p.current_mA) > 500 ? 'err-val' : 'val');
    return `<tr${ocClass}>
      <td class="val">${p.name}</td>
      <td class="${iClass}">${p.current_mA.toFixed(1)}&nbsp;mA${p.overcurrent ? ' &#9888;' : ''}</td>
      <td class="val">${p.power_mW.toFixed(1)}&nbsp;mW</td>
      <td class="muted">${p.shunt_mV.toFixed(2)}&nbsp;mV</td>
      <td><div class="toggle-wrap">${toggle}</div></td>
    </tr>`;
  }).join('');
  const allOk = power.every(p => p.ok);
  return `
    <div class="card">
      <div class="card-header">${dot(allOk && !hasOC, hasOC)} MLC Carrier Power &mdash; INA226</div>
      <div class="card-body">
        <table>
          <thead><tr><th>Carrier</th><th>Current</th><th>Power</th><th>Shunt</th><th>Power&nbsp;on</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function toggleCarrier(slot, checkbox) {
  checkbox.disabled = true;
  fetch(`/api/carrier/${slot}/power`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on: checkbox.checked}),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { checkbox.checked = !checkbox.checked; }
    checkbox.disabled = false;
    const label = checkbox.closest('tr').querySelector('.toggle-label');
    if (label) label.textContent = checkbox.checked ? 'ON' : 'OFF';
  })
  .catch(() => {
    checkbox.checked = !checkbox.checked;
    checkbox.disabled = false;
  });
}

function togglePSU(checkbox) {
  checkbox.disabled = true;
  fetch('/api/psu/power', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({on: checkbox.checked}),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      checkbox.checked = !checkbox.checked;
      alert('PSU error: ' + data.error);
    }
    checkbox.disabled = false;
  })
  .catch(() => {
    checkbox.checked = !checkbox.checked;
    checkbox.disabled = false;
  });
}

function setDAC(dacIdx, ch, btn) {
  const input = document.getElementById(`dac-${dacIdx}-${ch}`);
  const voltage = parseFloat(input.value);
  if (isNaN(voltage) || voltage < 0 || voltage > 3.3) {
    input.style.borderColor = 'var(--red)';
    return;
  }
  input.style.borderColor = '';
  btn.disabled = true;
  fetch(`/api/dac/${dacIdx}/channel/${ch}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({voltage}),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      input.style.borderColor = 'var(--red)';
    }
    btn.disabled = false;
  })
  .catch(() => { btn.disabled = false; });
}

function setCANMode(canIdx, sel) {
  sel.disabled = true;
  fetch(`/api/can/${canIdx}/mode`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mode: sel.value}),
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      alert('CAN mode error: ' + data.error);
    }
    sel.disabled = false;
  })
  .catch(() => { sel.disabled = false; });
}

function renderIO(io) {
  const sections = io.map(exp => {
    const header = `<div class="card-header" style="border-top:1px solid var(--border)">${dot(exp.ok)} ${exp.name}</div>`;
    if (!exp.present) return header + `<div class="card-body"><span class="muted">not present</span></div>`;
    function bitRow(val, label) {
      let bits = '';
      for (let i = 7; i >= 0; i--) {
        const hi = (val >> i) & 1;
        bits += `<span class="bit ${hi ? 'hi' : 'lo'}">${i}</span>`;
      }
      return `<div class="port-label">${label} &mdash; 0x${val.toString(16).padStart(2,'0').toUpperCase()}</div><div class="bits">${bits}</div>`;
    }
    return header + `<div class="card-body">${bitRow(exp.port0,'PORT0')}${bitRow(exp.port1,'PORT1')}</div>`;
  }).join('');
  const allOk = io.every(e => e.ok);
  return `
    <div class="card">
      <div class="card-header">${dot(allOk)} I/O Expanders &mdash; TCA9555</div>
      ${sections}
    </div>`;
}

function renderNRF(nrf) {
  const present = nrf && nrf.present;
  return `
    <div class="card">
      <div class="card-header">${dot(present)} nRF24L01+ (U23)</div>
      <div class="card-body">
        <span class="${present ? 'ok-val' : 'muted'}">${present ? 'Module present' : 'Not connected'}</span>
      </div>
    </div>`;
}

// ---- Poll ----

function render(data) {
  // Save DAC input values and active element before wiping the DOM
  const savedInputs = {};
  document.querySelectorAll('[id^="dac-"]').forEach(el => {
    savedInputs[el.id] = el.value;
  });
  const activeId = document.activeElement ? document.activeElement.id : null;

  const psuOn = !!(data.psu && data.psu.on);
  document.getElementById('main').innerHTML =
    renderPSU(data.psu) +
    renderCAN(data.can, psuOn) +
    renderPower(data.power, psuOn) +
    renderIO(data.io) +
    renderNRF(data.nrf24) +
    renderADC(data.adc) +
    renderDAC(data.dac, psuOn);

  // Restore whatever the user had typed into DAC inputs
  Object.entries(savedInputs).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) {
      el.value = val;
      if (id === activeId) el.focus();
    }
  });

  const dot = document.getElementById('conn-dot');
  dot.className = 'ok';
  document.getElementById('conn-label').textContent = 'live';
  document.getElementById('ts').textContent = data.timestamp.replace('T', ' ').replace('+00:00', ' UTC');
}

function poll() {
  fetch('/api/status')
    .then(r => r.json())
    .then(data => { render(data); })
    .catch(() => {
      const dot = document.getElementById('conn-dot');
      dot.className = 'err';
      document.getElementById('conn-label').textContent = 'disconnected';
    });
}

poll();
setInterval(poll, POLL_MS);


// =====================================================================
// CAN trace tab
// =====================================================================

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p =>
      p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'can') canEnsureStream();
}

let canES = null;
let canPaused = false;
let canBuffer = [];          // pending frames if paused
let canTotalSeen = 0;
const CAN_MAX_ROWS = 1500;   // cap DOM size

function canEnsureStream() {
  if (canES) return;
  const status = document.getElementById('can-status');
  status.textContent = 'connecting…';
  // Backfill last ~200 frames before going live
  fetch('/api/can/recent?n=200').then(r => r.json()).then(j => {
    (j.frames || []).forEach(f => canAppend(f));
  }).catch(() => {});
  canES = new EventSource('/api/can/stream');
  canES.onopen  = () => { status.textContent = 'live'; status.className = 'ok-val'; };
  canES.onerror = () => { status.textContent = 'reconnecting…'; status.className = 'err-val'; };
  canES.onmessage = ev => {
    try {
      const f = JSON.parse(ev.data);
      canAppend(f);
    } catch (e) { /* ignore */ }
  };
}

function canTogglePause() {
  canPaused = !canPaused;
  document.getElementById('can-pause').textContent = canPaused ? 'Resume' : 'Pause';
  document.getElementById('can-status').textContent =
      canPaused ? 'paused (buffering…)' : 'live';
  if (!canPaused) {
    // Drain whatever accumulated
    canBuffer.forEach(canRenderRow);
    canBuffer = [];
    canTrim();
    canMaybeScroll();
  }
}

function canClear() {
  document.getElementById('can-list').innerHTML = '';
  canBuffer = [];
  canTotalSeen = 0;
  document.getElementById('can-count').textContent = '0 frames';
}

function canAppend(f) {
  canTotalSeen++;
  document.getElementById('can-count').textContent =
      canTotalSeen.toLocaleString() + ' frames';
  if (canPaused) { canBuffer.push(f); return; }
  if (!canPassesFilter(f)) return;
  canRenderRow(f);
  canTrim();
  canMaybeScroll();
}

function canPassesFilter(f) {
  // Bus checkboxes
  const buses = Array.from(document.querySelectorAll('.can-bus:checked'))
                     .map(b => b.value);
  if (!buses.includes(f.bus)) return false;
  // ID glob: supports prefix match with '*'
  const flt = document.getElementById('can-idfilter').value.trim().toUpperCase();
  if (!flt) return true;
  const idHex = f.id.replace(/^0X/, '');
  if (flt.endsWith('*')) return idHex.startsWith(flt.slice(0, -1));
  return idHex === flt;
}

function canRenderRow(f) {
  const list = document.getElementById('can-list');
  const row = document.createElement('div');
  row.className = 'frame-row' + (f.decoded ? ' kind-' + f.decoded.kind : '');
  const tsSec = (f.ts_ms / 1000).toFixed(3);
  const dec = f.decoded ? canFmtDecoded(f.decoded) : '';
  row.innerHTML =
      `<span class="f-ts">${tsSec}</span>` +
      `<span class="f-bus">${f.bus}</span>` +
      `<span class="f-id">${f.id}</span>` +
      `<span class="f-dlc">[${f.dlc}]</span>` +
      `<span class="f-data">${f.data}</span>` +
      `<span class="f-dec">${dec}</span>`;
  list.appendChild(row);
}

function canFmtDecoded(d) {
  if (d.kind === 'ams_telem_status') {
    return `state=${d.state} ams_ok=${d.ams_ok ? '1' : '0'} ` +
           `mask=0x${d.module_online_mask.toString(16).toUpperCase().padStart(2,'0')} ` +
           `cell=${d.min_cell_mV}-${d.max_cell_mV} mV`;
  }
  if (d.kind === 'ams_telem_pack') {
    return `pack=${(d.pack_voltage_mV/1000).toFixed(2)} V ` +
           `I=${(d.filtered_mA/1000).toFixed(1)} A`;
  }
  if (d.kind === 'ams_telem_temps') {
    const cb = d.cockpit;
    const ck = cb && cb.valid
        ? `cockpit{${cb.mode_locked} TSMS=${cb.tsms?'1':'0'} DASH=${cb.dash_chg?'1':'0'}}`
        : `byte5=0x${(cb?cb.raw:0).toString(16)}`;
    return `temps ${d.min_tempC}/${d.avg_tempC}/${d.max_tempC} °C ` +
           `hb=${d.heartbeat} ${ck}`;
  }
  if (d.kind === 'vcu_dc_bus') {
    return `dc_bus=${d.dc_bus_V} V`;
  }
  return '';
}

function canTrim() {
  const list = document.getElementById('can-list');
  while (list.childElementCount > CAN_MAX_ROWS) list.removeChild(list.firstChild);
}

function canMaybeScroll() {
  if (!document.getElementById('can-autoscroll').checked) return;
  const list = document.getElementById('can-list');
  list.scrollTop = list.scrollHeight;
}
</script>
</body>
