<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BACKPLANE_HIL — Dashboard</title>
<style>
  :root {
    --bg:      #0f1117;
    --surface: #1a1d27;
    --border:  #2a2d3a;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --green:   #22c55e;
    --red:     #ef4444;
    --yellow:  #eab308;
    --blue:    #3b82f6;
    --font:    'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 15px; letter-spacing: 0.05em; color: var(--blue); }
  #meta { color: var(--muted); font-size: 11px; text-align: right; line-height: 1.6; }
  #conn-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: var(--muted); margin-right: 5px;
    vertical-align: middle;
  }
  #conn-dot.ok  { background: var(--green); }
  #conn-dot.err { background: var(--red); }

  /* ---- Main grid ---- */
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding: 20px 24px;
  }

  /* ---- Card ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card-header .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted);
  }
  .card-header .dot.ok     { background: var(--green); }
  .card-header .dot.err    { background: var(--red); }
  .card-header .dot.warn   { background: var(--yellow); }
  .card-body { padding: 12px 14px; }

  /* ---- PSU card ---- */
  #psu-status { font-size: 22px; font-weight: bold; }
  #psu-status.ok  { color: var(--green); }
  #psu-status.err { color: var(--red); }

  /* ---- Table inside cards ---- */
  table { width: 100%; border-collapse: collapse; }
  td, th {
    padding: 4px 6px;
    text-align: left;
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: normal; font-size: 11px; }
  tr + tr td { border-top: 1px solid var(--border); }
  .val { color: var(--text); }
  .err-val { color: var(--red); }
  .ok-val  { color: var(--green); }
  .muted   { color: var(--muted); }

  /* ---- Channel grid (ADC/DAC) ---- */
  .ch-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .ch-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 6px;
  }
  .ch-label { color: var(--muted); font-size: 10px; }
  .ch-val   { font-size: 13px; }

  /* ---- Port bits (TCA9555) ---- */
  .bits {
    display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px;
  }
  .bit {
    width: 16px; height: 16px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; border: 1px solid var(--border);
  }
  .bit.hi { background: var(--green); color: #000; }
  .bit.lo { background: var(--bg);    color: var(--muted); }
  .port-label { color: var(--muted); font-size: 10px; margin-top: 8px; margin-bottom: 2px; }

  /* ---- Placeholder ---- */
  .placeholder { color: var(--muted); font-style: italic; padding: 8px 0; }
</style>
</head>
<body>

<header>
  <h1>&#9632; BACKPLANE_HIL</h1>
  <div id="meta">
    <span id="conn-dot"></span><span id="conn-label">connecting…</span><br>
    <span id="ts">—</span>
  </div>
</header>

<main id="main">
  <div class="card"><div class="card-body placeholder">Loading…</div></div>
</main>

<script>
const POLL_MS = 2000;

function dot(ok) {
  return `<span class="dot ${ok ? 'ok' : 'err'}"></span>`;
}

function fmtErr(name) {
  return `<tr><td colspan="5" class="err-val">&#9888; ${name}: not responding</td></tr>`;
}

// ---- Renderers ----

function renderPSU(psu) {
  const ok = psu && psu.ok;
  return `
    <div class="card">
      <div class="card-header">${dot(ok)} ATX PSU</div>
      <div class="card-body">
        <div id="psu-status" class="${ok ? 'ok' : 'err'}">${ok ? 'PWR_OK' : 'NO POWER'}</div>
      </div>
    </div>`;
}

function renderCAN(cans) {
  const rows = cans.map(c => {
    if (!c.ok) return fmtErr(c.name);
    const tecClass = c.tec > 0 ? 'err-val' : 'ok-val';
    const recClass = c.rec > 0 ? 'err-val' : 'ok-val';
    return `<tr>
      <td class="val">${c.name}</td>
      <td class="muted">${c.mode}</td>
      <td class="${tecClass}">TEC&nbsp;${c.tec}</td>
      <td class="${recClass}">REC&nbsp;${c.rec}</td>
    </tr>`;
  }).join('');
  const allOk = cans.every(c => c.ok);
  return `
    <div class="card">
      <div class="card-header">${dot(allOk)} CAN Controllers</div>
      <div class="card-body">
        <table><tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

function renderADC(adcs) {
  const sections = adcs.map(a => {
    const header = `<div class="card-header" style="border-top:1px solid var(--border)">${dot(a.ok)} ${a.name}</div>`;
    if (!a.ok) return header + `<div class="card-body"><span class="err-val">&#9888; not responding</span></div>`;
    const cells = a.channels.map((v, i) =>
      `<div class="ch-cell"><div class="ch-label">ch${i}</div><div class="ch-val">${v.toFixed(3)}&nbsp;V</div></div>`
    ).join('');
    return header + `<div class="card-body"><div class="ch-grid">${cells}</div></div>`;
  }).join('');
  const allOk = adcs.every(a => a.ok);
  return `
    <div class="card" style="grid-column: span 2">
      <div class="card-header">${dot(allOk)} ADC Inputs &mdash; 3&times; MCP3208</div>
      ${sections}
    </div>`;
}

function renderDAC(dacs) {
  const sections = dacs.map(d => {
    const header = `<div class="card-header" style="border-top:1px solid var(--border)">${dot(d.ok)} ${d.name}</div>`;
    if (!d.ok) return header + `<div class="card-body"><span class="err-val">&#9888; not responding</span></div>`;
    const cells = d.channels.map((v, i) =>
      `<div class="ch-cell"><div class="ch-label">ch${i}</div><div class="ch-val">${v.toFixed(3)}&nbsp;V</div></div>`
    ).join('');
    return header + `<div class="card-body"><div class="ch-grid">${cells}</div></div>`;
  }).join('');
  const allOk = dacs.every(d => d.ok);
  return `
    <div class="card" style="grid-column: span 2">
      <div class="card-header">${dot(allOk)} DAC Outputs &mdash; 4&times; DAC80504</div>
      ${sections}
    </div>`;
}

function renderPower(power) {
  const rows = power.map(p => {
    if (!p.present) return `<tr><td class="val">${p.name}</td><td colspan="3" class="muted">not present</td></tr>`;
    const iClass = Math.abs(p.current_mA) > 1000 ? 'err-val' : 'val';
    return `<tr>
      <td class="val">${p.name}</td>
      <td class="${iClass}">${p.current_mA.toFixed(1)}&nbsp;mA</td>
      <td class="val">${p.power_mW.toFixed(1)}&nbsp;mW</td>
      <td class="muted">${p.shunt_mV.toFixed(2)}&nbsp;mV</td>
    </tr>`;
  }).join('');
  const allOk = power.every(p => p.ok);
  return `
    <div class="card">
      <div class="card-header">${dot(allOk)} MLC Carrier Power &mdash; INA226</div>
      <div class="card-body">
        <table>
          <thead><tr><th>Rail</th><th>Current</th><th>Power</th><th>Shunt</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderIO(io) {
  const sections = io.map(exp => {
    const header = `<div class="card-header" style="border-top:1px solid var(--border)">${dot(exp.ok)} ${exp.name}</div>`;
    if (!exp.present) return header + `<div class="card-body"><span class="muted">not present</span></div>`;
    function bitRow(val, label) {
      let bits = '';
      for (let i = 7; i >= 0; i--) {
        const hi = (val >> i) & 1;
        bits += `<span class="bit ${hi ? 'hi' : 'lo'}">${i}</span>`;
      }
      return `<div class="port-label">${label} &mdash; 0x${val.toString(16).padStart(2,'0').toUpperCase()}</div><div class="bits">${bits}</div>`;
    }
    return header + `<div class="card-body">${bitRow(exp.port0,'PORT0')}${bitRow(exp.port1,'PORT1')}</div>`;
  }).join('');
  const allOk = io.every(e => e.ok);
  return `
    <div class="card">
      <div class="card-header">${dot(allOk)} I/O Expanders &mdash; TCA9555</div>
      ${sections}
    </div>`;
}

function renderNRF(nrf) {
  const present = nrf && nrf.present;
  return `
    <div class="card">
      <div class="card-header">${dot(present)} nRF24L01+ (U23)</div>
      <div class="card-body">
        <span class="${present ? 'ok-val' : 'muted'}">${present ? 'Module present' : 'Not connected'}</span>
      </div>
    </div>`;
}

// ---- Poll ----

function render(data) {
  document.getElementById('main').innerHTML =
    renderPSU(data.psu) +
    renderCAN(data.can) +
    renderPower(data.power) +
    renderIO(data.io) +
    renderNRF(data.nrf24) +
    renderADC(data.adc) +
    renderDAC(data.dac);

  const dot = document.getElementById('conn-dot');
  dot.className = 'ok';
  document.getElementById('conn-label').textContent = 'live';
  document.getElementById('ts').textContent = data.timestamp.replace('T', ' ').replace('+00:00', ' UTC');
}

function poll() {
  fetch('/api/status')
    .then(r => r.json())
    .then(data => { render(data); })
    .catch(() => {
      const dot = document.getElementById('conn-dot');
      dot.className = 'err';
      document.getElementById('conn-label').textContent = 'disconnected';
    });
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
